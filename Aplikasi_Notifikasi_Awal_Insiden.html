<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aplikasi Notifikasi Awal Insiden — PT Maruwai Coal</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --navy:#0b2a5b; --navy2:#12356e; --orange:#c0392b; --accent:#e67e22;
  --bg:#eef1f6; --card:#ffffff; --line:#d4dae4; --text:#1f2733; --muted:#69748a;
  --green:#1e8449; --amber:#b9770e; --red:#a93226; --blue:#2471a3;
  --shadow:0 1px 3px rgba(15,30,60,.08),0 4px 16px rgba(15,30,60,.06);
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}

/* ===== LOGIN ===== */
#loginScreen{position:fixed;inset:0;background:linear-gradient(135deg,#0b2a5b,#12356e 60%,#1b4a8f);display:flex;align-items:center;justify-content:center;z-index:1000}
.login-card{background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:380px;padding:36px 34px}
.login-logo{text-align:center;margin-bottom:8px}
.login-logo .mark{display:inline-flex;gap:3px;flex-wrap:wrap;width:34px;vertical-align:middle;margin-right:6px}
.login-logo .mark i{width:14px;height:14px;border-radius:3px;display:block}
.brand-txt{font-size:26px;font-weight:800;color:var(--navy);letter-spacing:.5px}
.brand-txt small{color:var(--accent);font-weight:700}
.login-sub{text-align:center;color:var(--muted);font-size:12.5px;margin:4px 0 22px}
.login-card label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 5px}
.login-card input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px}
.login-card input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(11,42,91,.12)}
.btn-login{width:100%;margin-top:22px;padding:12px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-weight:700;font-size:15px}
.btn-login:hover{background:var(--navy2)}
.login-err{color:var(--red);font-size:12.5px;margin-top:12px;text-align:center;min-height:16px}
.login-hint{margin-top:18px;font-size:11px;color:var(--muted);background:#f4f6fa;border-radius:8px;padding:10px 12px;line-height:1.6}

/* ===== SHELL ===== */
#app{display:none;min-height:100vh}
.topbar{background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 20px;height:58px;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.topbar .logo{font-weight:800;font-size:19px;letter-spacing:.4px}
.topbar .logo small{color:var(--accent)}
.topbar .sys{font-size:12px;color:#aebfd8;margin-left:14px;border-left:1px solid #2c4f8a;padding-left:14px}
.topbar .spacer{flex:1}
.topbar .user{font-size:12.5px;text-align:right;line-height:1.4}
.topbar .user b{display:block}
.topbar .user span{color:#aebfd8;font-size:11px}
.btn-logout{margin-left:16px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;padding:7px 13px;border-radius:7px;font-size:12.5px}
.btn-logout:hover{background:rgba(255,255,255,.22)}

.nav{background:#fff;border-bottom:1px solid var(--line);display:flex;padding:0 16px;gap:2px;position:sticky;top:58px;z-index:40;overflow-x:auto}
.nav button{background:none;border:none;padding:14px 18px;font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.nav button.active{color:var(--navy);border-bottom-color:var(--orange)}
.nav button:hover{color:var(--navy)}

.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 60px}
.page{display:none}
.page.active{display:block}

/* ===== CARDS / GENERIC ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden}
.card-head{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.card-head h2{margin:0;font-size:15.5px;color:var(--navy)}
.card-head .sub{color:var(--muted);font-size:12px}
.card-body{padding:20px}
.section-title{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);font-weight:700;margin:4px 0 14px;border-bottom:2px solid #f0e2d8;padding-bottom:6px}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:860px){.g2,.g3,.g4{grid-template-columns:1fr}}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(11,42,91,.1)}
.field textarea{resize:vertical;min-height:64px;line-height:1.5}
.req{color:var(--red)}
.hint{font-size:11px;color:var(--muted);margin-top:4px}

.btn{padding:9px 16px;border:1px solid var(--line);background:#fff;border-radius:8px;font-weight:600;font-size:13px;color:var(--text)}
.btn:hover{background:#f4f6fa}
.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn-primary:hover{background:var(--navy2)}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-accent:hover{filter:brightness(.95)}
.btn-danger{background:#fff;color:var(--red);border-color:#e6b0aa}
.btn-danger:hover{background:#fdeceb}
.btn-ghost{background:none;border:none;color:var(--blue);padding:4px 6px;font-size:12.5px}
.btn-ghost:hover{text-decoration:underline}
.btn-sm{padding:6px 11px;font-size:12px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ===== TABLE ===== */
.tbl-wrap{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th{background:#f4f6fa;text-align:left;padding:10px 12px;font-weight:700;color:var(--navy);border-bottom:2px solid var(--line);white-space:nowrap}
table.data td{padding:10px 12px;border-bottom:1px solid #eef1f6;vertical-align:middle}
table.data tr:hover td{background:#fafbfd}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.b-draft{background:#eceff4;color:#5b6980}
.b-review-crs{background:#fef5e7;color:#b9770e}
.b-review-pja{background:#e8f4fd;color:#2471a3}
.b-approved{background:#e8f8f0;color:#1e8449}
.b-rejected{background:#fdecea;color:#a93226}
.b-fatality{background:#a93226;color:#fff}
.b-lti{background:#e67e22;color:#fff}
.b-mtc{background:#f1c40f;color:#3a2e00}
.b-fac{background:#3498db;color:#fff}
.b-npd{background:#95a5a6;color:#fff}

.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:5px;background:#eef1f6;color:var(--muted);font-weight:600}

/* stat cards */
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow)}
.stat .k{font-size:12px;color:var(--muted);font-weight:600}
.stat .v{font-size:30px;font-weight:800;color:var(--navy);margin-top:4px;line-height:1}
.stat .d{font-size:11px;color:var(--muted);margin-top:6px}
.stat.acc-red{border-left:4px solid var(--red)}
.stat.acc-orange{border-left:4px solid var(--accent)}
.stat.acc-green{border-left:4px solid var(--green)}
.stat.acc-blue{border-left:4px solid var(--blue)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,25,45,.55);display:none;align-items:flex-start;justify-content:center;z-index:200;padding:36px 16px;overflow-y:auto}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:920px;box-shadow:0 24px 70px rgba(0,0,0,.4)}
.modal.narrow{max-width:520px}
.modal-head{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal-head h3{margin:0;font-size:16px;color:var(--navy)}
.modal-head .x{margin-left:auto;background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1}
.modal-body{padding:22px;max-height:70vh;overflow-y:auto}
.modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:13px 20px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.3);font-size:13.5px;z-index:500;opacity:0;transform:translateY(12px);transition:.3s;max-width:340px}
.toast.show{opacity:1;transform:translateY(0)}
.toast.ok{background:var(--green)} .toast.err{background:var(--red)} .toast.warn{background:var(--amber)}

.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:8px}
.photo-item{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;aspect-ratio:4/3;background:#f4f6fa}
.photo-item img{width:100%;height:100%;object-fit:cover;display:block}
.photo-item .del{position:absolute;top:4px;right:4px;background:rgba(169,50,38,.92);color:#fff;border:none;width:22px;height:22px;border-radius:50%;font-size:13px;line-height:1;cursor:pointer}

.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 16px 26px;border-left:2px solid var(--line);margin-left:6px}
.timeline li:last-child{border-left-color:transparent;padding-bottom:0}
.timeline li .dot{position:absolute;left:-7px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--navy);border:2px solid #fff}
.timeline li .tl-act{font-weight:700;font-size:12.5px}
.timeline li .tl-meta{font-size:11.5px;color:var(--muted)}
.timeline li .tl-note{font-size:12px;margin-top:3px;background:#f4f6fa;border-radius:6px;padding:6px 9px}

.filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:16px}
.filter-bar .field{min-width:150px}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:13.5px}

.sev-grid{display:grid;grid-template-columns:auto repeat(5,1fr);gap:6px;align-items:center;font-size:12px}
.sev-card{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sev-hd{padding:8px 12px;font-weight:800;font-size:12px;letter-spacing:.5px;color:#fff}
.sev-hd.act{background:var(--navy)} .sev-hd.pot{background:var(--accent)}
.sev-row{display:grid;grid-template-columns:60px 1fr;gap:12px;align-items:center;padding:8px 14px;border-top:1px solid #eef1f6}
.sev-row:first-of-type{border-top:none}
.sev-lbl{font-weight:700;font-size:13px;color:var(--navy)}
.sev-sel{padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:13px}
.sev-sel.wide{width:100%}
.sev-badge{display:inline-block;text-align:center;min-width:30px;padding:3px 8px;border-radius:6px;font-weight:800;font-size:12px;background:#eef1f6;color:#69748a}
.sev-grid .h{font-weight:700;color:var(--navy);text-align:center;font-size:11px}
.sev-grid .rl{font-weight:700;color:var(--muted)}
.sev-grid input{padding:6px;text-align:center}

.chk-line{display:flex;gap:20px;align-items:center;margin-top:6px}
.chk-line label{display:flex;gap:6px;align-items:center;font-weight:500;color:var(--text);cursor:pointer}

.flow-steps{display:flex;gap:0;flex-wrap:wrap;margin:2px 0 4px}
.flow-steps .fs{flex:1;min-width:90px;text-align:center;padding:8px 4px;font-size:11px;position:relative;color:var(--muted)}
.flow-steps .fs.done{color:var(--green);font-weight:700}
.flow-steps .fs.cur{color:var(--orange);font-weight:800}
.flow-steps .fs .n{display:inline-flex;width:22px;height:22px;border-radius:50%;background:#eef1f6;color:var(--muted);align-items:center;justify-content:center;font-weight:700;margin-bottom:4px}
.flow-steps .fs.done .n{background:var(--green);color:#fff}
.flow-steps .fs.cur .n{background:var(--orange);color:#fff}

.chart-box{position:relative;height:280px}
.mini-note{font-size:11px;color:var(--muted);margin-top:6px}
.tag-role{font-size:10px;padding:2px 7px;border-radius:5px;font-weight:700}
.r-user{background:#e8f4fd;color:#2471a3}.r-pja{background:#e8f8f0;color:#1e8449}.r-crs{background:#fef5e7;color:#b9770e}.r-super{background:#f4e8fd;color:#7d3c98}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">
      <img id="loginLogo" alt="AlamTri Geo" style="max-width:230px;width:100%;height:auto">
    </div>
    <div class="login-sub">Compliance Reporting System · Notifikasi Awal Insiden<br>PT Maruwai Coal — Alamtri Minerals Indonesia</div>
    <label>Email (Username)</label>
    <input id="lgEmail" type="email" placeholder="nama@alamtri.com" autocomplete="username">
    <label>Password</label>
    <input id="lgPass" type="password" placeholder="••••••••" autocomplete="current-password">
    <button class="btn-login" onclick="doLogin()">Masuk</button>
    <div class="login-err" id="lgErr"></div>
    <div class="login-hint" id="lgHint"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <div class="topbar">
    <img id="topLogo" alt="AlamTri Geo" style="height:30px;width:auto">
    <div class="sys" id="topSys">Notifikasi Awal Insiden — Compliance Reporting System</div>
    <div class="spacer"></div>
    <span id="syncBadge" onclick="doSync(false)" title="Klik untuk sinkron sekarang" style="display:none;cursor:pointer;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:20px;background:#eef1f6;color:#69748a;margin-right:14px;white-space:nowrap">☁︎ Sinkron</span>
    <div class="user"><b id="uName">—</b><span id="uRole">—</span></div>
    <button class="btn-logout" onclick="doLogout()">Keluar</button>
  </div>

  <div class="nav" id="navBar"></div>

  <div class="wrap">
    <!-- DASHBOARD -->
    <div class="page active" id="page-dashboard"></div>
    <!-- INPUT / FORM -->
    <div class="page" id="page-form"></div>
    <!-- DAFTAR -->
    <div class="page" id="page-list"></div>
    <!-- REPORT -->
    <div class="page" id="page-report"></div>
    <!-- SETTING -->
    <div class="page" id="page-setting"></div>
  </div>
</div>

<!-- MODAL: detail / review -->
<div class="modal-bg" id="modalDetail">
  <div class="modal">
    <div class="modal-head"><h3 id="mdTitle">Detail Notifikasi</h3><button class="x" onclick="closeModal('modalDetail')">×</button></div>
    <div class="modal-body" id="mdBody"></div>
    <div class="modal-foot" id="mdFoot"></div>
  </div>
</div>

<!-- MODAL: user editor -->
<div class="modal-bg" id="modalUser">
  <div class="modal narrow">
    <div class="modal-head"><h3 id="muTitle">Tambah User</h3><button class="x" onclick="closeModal('modalUser')">×</button></div>
    <div class="modal-body" id="muBody"></div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal('modalUser')">Batal</button>
      <button class="btn-primary btn" onclick="saveUser()">Simpan</button>
    </div>
  </div>
</div>

<!-- MODAL: master data editor -->
<div class="modal-bg" id="modalMaster">
  <div class="modal narrow">
    <div class="modal-head"><h3 id="mstTitle">Master Data</h3><button class="x" onclick="closeModal('modalMaster')">×</button></div>
    <div class="modal-body" id="mstBody"></div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal('modalMaster')">Batal</button>
      <button class="btn-primary btn" id="mstSave">Simpan</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

function seedCcow(){
  let m=load(LS_CCOW,null);
  if(!m){m=CCOW_DEFAULT.slice();save(LS_CCOW,m);}
  else{ // migrasi: pastikan setiap CCOW punya field ktt & doc
    let changed=false;
    m.forEach(c=>{
      if(c.ktt===undefined){const d=CCOW_DEFAULT.find(x=>x.code===c.code);c.ktt=d?d.ktt:'';changed=true;}
      if(c.doc===undefined){const d=CCOW_DEFAULT.find(x=>x.code===c.code);c.doc=d?d.doc:'F-'+c.code+'-IMS-14-001 Rev 4.0';changed=true;}
    });
    if(changed)save(LS_CCOW,m);
  }
  return m;
}
let CCOW_MASTER=seedCcow();

function ccowDoc(code){const c=CCOW_MASTER.find(x=>x.code===code);return (c&&c.doc)?c.doc:'F-MAC-IMS-14-001 Rev 4.0';}

function numPrefix(classification){
  return (classification||'').toLowerCase().includes('pelanggaran prosedur')?'PP':'NI';

/* auto-number PER prefix PER CCOW per tahun: Nomor/PREFIX-CCOW/bulan(romawi)/tahun */
function nextNumber(ccow,classification){
  const now=new Date();
  const yr=now.getFullYear(), mo=now.getMonth()+1;
  const pfx=numPrefix(classification);
  let seq=load(LS_SEQ,{});
  const key=pfx+'-'+ccow+'-'+yr;        // urutan dipisah per prefix & CCOW
  seq[key]=(seq[key]||0)+1;
  save(LS_SEQ,seq);
  const n=String(seq[key]).padStart(3,'0');
  return `${n}/${pfx}-${ccow}/${ROMAN[mo]}/${yr}`;
}
function peekNumber(ccow,classification){
  const now=new Date();const yr=now.getFullYear(),mo=now.getMonth()+1;
  const pfx=numPrefix(classification);
  let seq=load(LS_SEQ,{});const key=pfx+'-'+ccow+'-'+yr;
  const n=String((seq[key]||0)+1).padStart(3,'0');
  return `${n}/${pfx}-${ccow}/${ROMAN[mo]}/${yr}`;
}

/* =========================================================
   AUTH
   ========================================================= */
function renderLoginHint(){
  const el=document.getElementById('lgHint');
  if(el)el.innerHTML='';
}
function doLogin(){
  const em=document.getElementById('lgEmail').value.trim().toLowerCase();
  const pw=document.getElementById('lgPass').value;
  const u=USERS.find(x=>x.email.toLowerCase()===em&&x.pass===pw&&x.active);
  if(!u){document.getElementById('lgErr').textContent='Email atau password salah, atau akun non-aktif.';return;}
  SESSION={id:u.id};save(LS_SESSION,SESSION);
  startApp();
}
function doLogout(){localStorage.removeItem(LS_SESSION);SESSION=null;location.reload();}
function currentUser(){return USERS.find(u=>u.id===(SESSION&&SESSION.id));}

document.getElementById('lgPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

/* =========================================================
   NAV & ROLE VISIBILITY
   ========================================================= */
const NAV=[
 {id:'dashboard',label:'Dashboard',roles:['user','pja','crs','superuser']},
 {id:'form',label:'Input Notifikasi',roles:['user','crs','superuser']},
 {id:'list',label:'Daftar & Workflow',roles:['user','pja','crs','superuser']},
 {id:'report',label:'Report & Summary',roles:['user','pja','crs','superuser']},
 {id:'setting',label:'Setting',roles:['superuser']},
];
function buildNav(){
  const u=currentUser();const bar=document.getElementById('navBar');bar.innerHTML='';
  NAV.filter(n=>n.roles.includes(u.role)).forEach((n,i)=>{
    const b=document.createElement('button');
    b.textContent=n.label;b.dataset.page=n.id;
    b.onclick=()=>goPage(n.id);
    if(i===0)b.classList.add('active');
    bar.appendChild(b);
  });
}
let _formPending=null; // record yang akan dibuka di halaman form (untuk edit)
function goPage(id){
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===id));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  const ts=document.getElementById('topSys');if(ts)ts.textContent='Notifikasi Awal Insiden — Compliance Reporting System';
  if(id==='dashboard')renderDashboard();
  if(id==='form'){renderForm(_formPending);_formPending=null;}
  if(id==='list')renderList();
  if(id==='report')renderReport();
  if(id==='setting')renderSetting();
}
function editRecord(r){_formPending=r;closeModal('modalDetail');goPage('form');}

function startApp(){
  const u=currentUser();
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('topLogo').src=LOGO_WHITE;
  document.getElementById('uName').textContent=u.name;
  document.getElementById('uRole').innerHTML=ROLES[u.role].t+' · '+(u.dept||'');
  buildNav();
  goPage('dashboard');
  // aktifkan indikator & sinkron awal bila Google Sheet sudah dikonfigurasi
  if(syncConfigured()){
    document.getElementById('syncBadge').style.display='inline-block';
    setSyncBadge(navigator.onLine?'idle':'off');
    if(navigator.onLine)doSync(true);
  }
}

function toast(msg,type){
  const t=document.getElementById('toast');
  t.className='toast show '+(type||'');t.textContent=msg;
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2800);
}
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmtDate(d){if(!d)return '-';const p=d.split('-');return p.length===3?`${p[2]}-${p[1]}-${p[0]}`:d;}
/* buang penomoran manual di awal baris (mis "1. ", "2) ", "- ") agar tidak dobel dgn <ol> */
function stripNum(s){return String(s||'').replace(/^\s*\d+[\.\)]\s*/,'').replace(/^\s*[-•]\s*/,'').trim();}
function toList(txt){return String(txt||'').split('\n').map(stripNum).filter(Boolean);}

/* boot */
document.getElementById('loginLogo').src=LOGO_FULL;
if(SESSION&&currentUser()){startApp();}else{renderLoginHint();}

<script>

/* tombol footer form sesuai peran & status record */
function formFooterButtons(u,d){
  const st=d.status||'draft';
  // CRS sedang review/edit -> simpan & ajukan ke PJA
  if((u.role==='crs'||u.role==='superuser')&&st==='review_crs'){
    return `<button class="btn btn-primary" onclick="saveForm('draft')">💾 Simpan Perubahan</button>
            <button class="btn btn-accent" onclick="saveForm('to_pja')">📤 Simpan &amp; Ajukan ke PJA</button>`;
  }
  // PJA sedang review/edit -> simpan & approve (balik ke CRS utk blast)
  if((u.role==='pja'||u.role==='superuser')&&st==='review_pja'){
    return `<button class="btn btn-primary" onclick="saveForm('draft')">💾 Simpan Perubahan</button>
            <button class="btn btn-accent" onclick="saveForm('approve')">✅ Simpan &amp; Approve</button>`;
  }
  // User / CRS input baru atau perbaikan draft/ditolak -> draft + ajukan ke CRS
  const canSubmit=(u.role==='user'||u.role==='superuser'||u.role==='crs');
  return `<button class="btn btn-primary" onclick="saveForm('draft')">💾 Simpan Draft</button>
    ${canSubmit?`<button class="btn btn-accent" onclick="saveForm('submit')">📤 Simpan &amp; Ajukan Review ke CRS</button>`:''}`;
}
function onCompanyChange(){
  const sel=document.getElementById('f_company');
  const opt=sel.options[sel.selectedIndex];
  const ccow=opt?opt.getAttribute('data-ccow'):'';
  document.getElementById('f_ccow').value=ccow||'';
  updateNumberPreview();
  syncApprovedBy();
  syncDocCode();
}
/* kode dokumen tidak lagi ditampilkan di halaman input; hanya muncul di output PDF/PPT.
   fungsi dipertahankan agar pemanggilan lama tetap aman (no-op untuk tampilan). */
function syncDocCode(){
  const fc=document.getElementById('formDocCode');if(fc){const ccow=document.getElementById('f_ccow')?document.getElementById('f_ccow').value:'';fc.textContent=ccow?ccowDoc(ccow):'';}
}
function onClassChange(){updateNumberPreview();}
/* isi "Disetujui oleh" otomatis dari KTT sesuai CCOW (kecuali user sudah mengubah manual) */
function syncApprovedBy(){
  const ccow=document.getElementById('f_ccow').value;
  const ab=document.getElementById('f_approvedBy');
  if(!ab)return;
  const ktt=ccowKtt(ccow);
  // ganti bila kosong atau masih berisi salah satu KTT master (bukan editan manual user)
  const isMasterVal=CCOW_MASTER.some(c=>c.ktt&&c.ktt===ab.value);
  if(ktt&&(ab.value===''||isMasterVal||ab._auto)){ab.value=ktt;ab._auto=true;}
}
function syncLocationDetailFocus(){/* placeholder: lokasi umum & detail kini field terpisah */}
function updateNumberPreview(){
  const c=document.getElementById('f_ccow').value;
  const cls=document.getElementById('f_class')?document.getElementById('f_class').value:'';
  const nf=document.getElementById('f_number');
  if(!nf.value)document.getElementById('numHint').textContent=c?('Preview: '+peekNumber(c,cls)+' (dibuat saat simpan, urut per CCOW & jenis)'):'Pilih perusahaan dahulu untuk menentukan CCOW.';
}
/* severity row: satu select Nilai Konsekuensi 0..5. Stored value = "0".."5" */
function sevRowHtml(pref,a,val){
  const cur=(val==null?'':String(val));
  const opts=['<option value="">–</option>'].concat(K_VALUES.map(n=>`<option value="${n}" ${cur===String(n)?'selected':''}>${n}</option>`)).join('');
  return `<div class="sev-row">
    <div class="sev-lbl" title="${esc(a.t)}">${a.s}</div>
    <select class="sev-sel wide" id="${pref}_${a.k}">${opts}</select>
  </div>`;
}
function openMatrixRef(){
  document.getElementById('mdTitle').textContent='Skala Nilai Konsekuensi — Matriks Penilaian Risiko K3';
  const rows=[
   ['5','Kematian / cacat permanen','> 20% aset','Gangguan flora-fauna, sulit dipulihkan','Pelanggaran serius, operasi bisa dihentikan','Sangat serius, berpotensi demonstrasi'],
   ['4','Cidera berat','10–20% aset','Gangguan flora-fauna, masih bisa dipulihkan','—','Isu meluas ke media nasional/internasional'],
   ['3','Cidera ringan, dirawat > 1 hari','2,5–10% aset','Pencemaran major dalam area kerja','Teguran/sanksi dari pemerintah','Keluhan stakeholder (formal/informal)'],
   ['2','Cidera ringan, dirawat hari berikutnya','1–2,5% aset','Pencemaran minor keluar area','—','Isu meluas ke media lokal'],
   ['1','Cidera ringan / first aid','< 1% aset','Pencemaran minor & terlokalisir','Pelanggaran minor','Tidak menimbulkan keluhan'],
   ['0','Tidak ada konsekuensi','Tidak ada','Tidak ada','Tidak ada','Tidak ada'],
  ];
  document.getElementById('mdBody').innerHTML=`
    <div class="hint" style="margin-bottom:10px">Nilai Konsekuensi diisi per aspek: K3, KK (Kerugian Keuangan), LH (Lingkungan Hidup), KSL (Pelanggaran Peraturan), PP (Komunitas Sosial Lokal).</div>
    <table class="data" style="font-size:12px"><thead><tr><th>Nilai</th><th>K3</th><th>KK</th><th>LH</th><th>KSL</th><th>PP</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td style="text-align:center"><b>${r[0]}</b></td>${r.slice(1).map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  document.getElementById('mdFoot').innerHTML='<button class="btn" onclick="closeModal(\'modalDetail\')">Tutup</button>';
  openModal('modalDetail');
}
function addPhotos(e){
  const files=[...e.target.files];
  files.forEach(f=>{
    const r=new FileReader();
    r.onload=()=>{compressImage(r.result,(compressed)=>{formPhotos.push({id:uid(),data:compressed});drawPhotos();});};
    r.readAsDataURL(f);
  });
  e.target.value='';
}
/* kompres gambar di browser: maks 1280px sisi terpanjang, kualitas JPEG 0.7 */
function compressImage(dataUrl,cb,maxDim,quality){
  maxDim=maxDim||1280;quality=quality||0.7;
  const img=new Image();
  img.onload=()=>{
    let w=img.width,h=img.height;
    if(w>h&&w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;}
    else if(h>=w&&h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;}
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;
    cv.getContext('2d').drawImage(img,0,0,w,h);
    try{cb(cv.toDataURL('image/jpeg',quality));}catch(e){cb(dataUrl);}
  };
  img.onerror=()=>cb(dataUrl);
  img.src=dataUrl;
}
function drawPhotos(){
  const g=document.getElementById('photoGrid');if(!g)return;
  g.innerHTML=formPhotos.map(p=>`<div class="photo-item"><img src="${p.data}"><button class="del" onclick="delPhoto('${p.id}')">×</button></div>`).join('')
    ||'<div class="hint">Belum ada foto.</div>';
}
function delPhoto(id){formPhotos=formPhotos.filter(p=>p.id!==id);drawPhotos();}

function sevVal(pref,aspect){
  const el=document.getElementById(`${pref}_${aspect}`);
  return el?el.value:'';
}
function collectForm(){
  const g=id=>document.getElementById(id).value.trim();
  const hpriEl=document.querySelector('input[name="f_hpri"]:checked');
  const sev=pref=>{const o={};ASPECT.forEach(a=>o[a.k]=sevVal(pref,a.k));return o;};
  return {
    ccow:g('f_ccow'),classification:g('f_class'),title:g('f_title'),
    date:g('f_date'),time:g('f_time'),location:g('f_location'),locationDetail:g('f_locationDetail'),company:g('f_company'),
    hpri:hpriEl?hpriEl.value:'',
    sevAct:sev('a'),sevPot:sev('p'),
    kronologi:g('f_kronologi'),fakta:g('f_fakta'),
    akibatManusia:g('f_akManusia'),akibatAlat:g('f_akAlat'),akibatLingkungan:g('f_akLingkungan'),
    corrective:g('f_corrective'),
    reportedBy:g('f_reportedBy'),approvedBy:g('f_approvedBy'),
    photos:formPhotos.slice(),
  };
}
function saveForm(mode){
  const u=currentUser();const f=collectForm();
  const miss=[];
  if(!f.company)miss.push('Perusahaan / Company');
  if(!f.ccow)miss.push('CCOW');
  if(!f.title)miss.push('Judul Insiden');
  if(!f.classification)miss.push('Klasifikasi Insiden');
  if(!f.date)miss.push('Tanggal / Date');
  if(!f.time)miss.push('Waktu / Time');
  if(!f.location)miss.push('Lokasi / Location');
  if(!f.hpri)miss.push('Status HPRI / Non-HPRI');
  if(!f.kronologi)miss.push('Kronologi Awal');
  if(miss.length){
    alert('Tidak dapat menyimpan.\n\nField berikut wajib diisi/dipilih terlebih dahulu:\n\n• '+miss.join('\n• '));
    toast('Ada '+miss.length+' field wajib yang belum lengkap.','err');
    return;
  }
  let rec;
  if(editingId){
    rec=DATA.find(r=>r.id===editingId);
    Object.assign(rec,f);
  }else{
    rec=Object.assign(blankForm(),f);
    rec.id=uid();rec.createdBy=u.name;rec.createdAt=new Date().toISOString();rec.updatedAt=rec.createdAt;
    rec.number=nextNumber(f.ccow,f.classification);
    DATA.unshift(rec);
  }
  if(mode==='submit'){
    rec.status='review_crs';
    pushHistory(rec,'Diajukan review ke CRS',u,'');
    toast('Notifikasi '+rec.number+' diajukan ke CRS.','ok');
  }else if(mode==='to_pja'){
    rec.status='review_pja';
    pushHistory(rec,'Direview CRS, diteruskan ke PJA',u,'');
    toast('Notifikasi '+rec.number+' diteruskan ke PJA.','ok');
  }else if(mode==='approve'){
    rec.status='approved';
    pushHistory(rec,'Disetujui PJA — kembali ke CRS untuk blast email',u,'');
    toast('Notifikasi '+rec.number+' di-approve. Menunggu blast oleh CRS.','ok');
  }else{
    if(!rec.status)rec.status='draft';
    if(!editingId)pushHistory(rec,'Draft dibuat',u,'');
    else pushHistory(rec,'Draft diperbarui',u,'');
    toast('Tersimpan sebagai draft.','ok');
  }
  save(LS_DATA,DATA);
  autoSync();
  editingId=null;
  goPage('list');
}
function pushHistory(rec,action,user,note){
  rec.history=rec.history||[];
  rec.history.push({at:new Date().toISOString(),action,by:user.name,role:user.role,note:note||''});
  rec.updatedAt=new Date().toISOString();
}
function stampUpdated(rec){if(rec)rec.updatedAt=new Date().toISOString();}
/* soft delete: tandai deleted=true + updatedAt agar penghapusan ikut tersinkron (merge) */
function softDeleteIncident(id){
  const r=DATA.find(x=>x.id===id);
  if(r){r.deleted=true;r.updatedAt=new Date().toISOString();}
  save(LS_DATA,DATA);
  autoSync();
}
/* daftar aktif = yang tidak dihapus */
function activeData(){return DATA.filter(r=>!r.deleted);}
</script>

<script>
/* =========================================================
   LIST & WORKFLOW
   ========================================================= */
function visibleRecords(){
  // semua role bisa lihat semua record utk transparansi; kecuali yang sudah dihapus
  return activeData();
}
function renderList(){
  const el=document.getElementById('page-list');
  el.innerHTML=`
  <div class="card">
    <div class="card-head"><h2>Daftar Notifikasi & Workflow</h2><span class="sub">Alur: Input → Review CRS → Review PJA → Approve → Blast Email</span></div>
    <div class="card-body">
      <div class="filter-bar">
        <div class="field"><label>Cari</label><input id="lf_q" placeholder="No / judul / lokasi" oninput="renderListRows()"></div>
        <div class="field"><label>Status</label><select id="lf_status" onchange="renderListRows()">
          <option value="">Semua</option>${Object.entries(STATUS).map(([k,v])=>`<option value="${k}">${v.t}</option>`).join('')}</select></div>
        <div class="field"><label>Klasifikasi</label><select id="lf_class" onchange="renderListRows()">
          <option value="">Semua</option>${CLASS_MASTER.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select></div>
        <div class="field"><label>CCOW</label><select id="lf_ccow" onchange="renderListRows()">
          <option value="">Semua</option>${ccowCodes().map(c=>`<option value="${c}">${c}</option>`).join('')}</select></div>
      </div>
      <div class="tbl-wrap"><table class="data" id="listTbl"></table></div>
    </div>
  </div>`;
  renderListRows();
}
function renderListRows(){
  const q=(document.getElementById('lf_q').value||'').toLowerCase();
  const fs=document.getElementById('lf_status').value;
  const fc=document.getElementById('lf_class').value;
  const fw=document.getElementById('lf_ccow').value;
  let rows=visibleRecords().filter(r=>{
    if(fs&&r.status!==fs)return false;
    if(fc&&r.classification!==fc)return false;
    if(fw&&r.ccow!==fw)return false;
    if(q){const hay=(r.number+' '+r.title+' '+r.location+' '+r.company).toLowerCase();if(!hay.includes(q))return false;}
    return true;
  });
  const t=document.getElementById('listTbl');
  if(!rows.length){t.innerHTML='';t.parentElement.innerHTML='<div class="empty">Tidak ada data notifikasi. Mulai dari menu <b>Input Notifikasi</b>.</div>';return;}
  t.innerHTML=`<thead><tr>
    <th>No. Notifikasi</th><th>Judul</th><th>Tanggal</th><th>Lokasi</th><th>Klasifikasi</th><th>Status</th><th>Aksi</th>
  </tr></thead><tbody>${rows.map(rowHtml).join('')}</tbody>`;
}
function classBadge(v){return `<span class="badge ${classBadgeClass(v)}">${esc(v||'-')}</span>`;}
function statusBadge(s){const x=STATUS[s]||{t:s,b:'b-draft'};return `<span class="badge ${x.b}">${x.t}</span>`;}
function rowHtml(r){
  return `<tr>
    <td><b>${esc(r.number)}</b></td>
    <td>${esc(r.title)}</td>
    <td>${fmtDate(r.date)}</td>
    <td>${esc(r.location)}</td>
    <td>${classBadge(r.classification)}</td>
    <td>${statusBadge(r.status)}</td>
    <td><button class="btn-ghost" onclick="openDetail('${r.id}')">Buka</button></td>
  </tr>`;
}

function flowHtml(status){
  const order=['draft','review_crs','review_pja','approved'];
  let curIdx=order.indexOf(status==='rejected'?'draft':status);
  return `<div class="flow-steps">${FLOW_STEPS.map((s,i)=>{
    let cls=i<curIdx?'done':(i===curIdx?'cur':'');
    return `<div class="fs ${cls}"><span class="n">${i<curIdx?'✓':i+1}</span><br>${s.label}</div>`;
  }).join('')}</div>${status==='rejected'?'<div class="mini-note" style="color:var(--red);font-weight:700">Status: DITOLAK — dikembalikan ke pelapor untuk perbaikan.</div>':''}`;
}

function openDetail(id){
  const r=DATA.find(x=>x.id===id);if(!r)return;
  // muat foto dari Drive bila record punya photoIds tapi belum ada foto lokal
  const needPhotos=(r.photoIds&&r.photoIds.length)&&!(r.photos&&r.photos.length);
  if(needPhotos&&syncConfigured()&&navigator.onLine){
    ensurePhotos(r).then(()=>{const still=document.getElementById('modalDetail');if(still&&still.classList.contains('show'))openDetail(id);});
  }
  const u=currentUser();
  document.getElementById('mdTitle').textContent=r.number+' — '+r.title;
  const sevCell=(v)=>{if(v===''||v==null)return '<span style="color:#b0b8c6">–</span>';return `<b>${esc(v)}</b>`;};
  const sevTable=(o)=>`<table class="data" style="margin-top:4px"><thead><tr><th>Aspek</th><th>Nilai</th></tr></thead><tbody>${ASPECT.map(a=>`<tr><td>${a.s}</td><td>${sevCell(o[a.k])}</td></tr>`).join('')}</tbody></table>`;
  const fakta=toList(r.fakta);
  const corr=toList(r.corrective);
  const akibat=[['Manusia',r.akibatManusia],['Alat',r.akibatAlat],['Lingkungan',r.akibatLingkungan]].filter(x=>x[1]);
  document.getElementById('mdBody').innerHTML=`
    ${flowHtml(r.status)}
    <div class="grid g2" style="margin-top:14px">
      <div><b>Tanggal:</b> ${fmtDate(r.date)} ${esc(r.time)}</div>
      <div><b>Lokasi:</b> ${esc(r.location)}${r.locationDetail?' — '+esc(r.locationDetail):''}</div>
      <div><b>Perusahaan:</b> ${esc(r.company)}</div>
      <div><b>CCOW:</b> ${r.ccow} — ${ccowName(r.ccow)}</div>
      <div><b>Klasifikasi:</b> ${classBadge(r.classification)}</div>
      <div><b>HPRI:</b> ${esc(r.hpri)||'-'}</div>
    </div>
    <div class="grid g2" style="margin-top:10px">
      <div><b>Severity Aktual (Nilai Konsekuensi)</b>${sevTable(r.sevAct)}</div>
      <div><b>Severity Potensial (Nilai Konsekuensi)</b>${sevTable(r.sevPot)}</div>
    </div>
    <div style="margin-top:12px"><b>Kronologi Awal:</b><div class="tl-note">${esc(r.kronologi)||'-'}</div></div>
    ${fakta.length?`<div style="margin-top:8px"><b>Fakta Kejadian:</b><ol style="margin:6px 0 0 18px">${fakta.map(c=>`<li>${esc(c)}</li>`).join('')}</ol></div>`:''}
    ${akibat.length?`<div style="margin-top:8px"><b>Akibat Kecelakaan:</b><div class="tl-note" style="display:grid;grid-template-columns:auto 1fr;gap:2px 8px">${akibat.map(x=>`<div style="font-weight:600">${x[0]} :</div><div>${esc(x[1])}</div>`).join('')}</div></div>`:''}
    ${corr.length?`<div style="margin-top:8px"><b>Tindakan Perbaikan:</b><ol style="margin:6px 0 0 18px">${corr.map(c=>`<li>${esc(c)}</li>`).join('')}</ol></div>`:''}
    ${(r.photos&&r.photos.length)?`<div style="margin-top:10px"><b>Foto:</b><div class="photo-grid">${r.photos.map(p=>`<div class="photo-item"><img src="${p.data}"></div>`).join('')}</div></div>`:''}
    <div style="margin-top:14px"><b>Dilaporkan oleh:</b> ${esc(r.reportedBy)||'-'} · <b>Disetujui oleh:</b> ${esc(r.approvedBy)||'-'}</div>
    <div class="section-title" style="margin-top:20px">Riwayat Workflow</div>
    <ul class="timeline">${(r.history||[]).map(h=>`<li><span class="dot"></span>
      <div class="tl-act">${esc(h.action)}</div>
      <div class="tl-meta">${new Date(h.at).toLocaleString('id-ID')} · ${esc(h.by)} <span class="tag-role ${ROLES[h.role]?ROLES[h.role].cls:''}">${ROLES[h.role]?ROLES[h.role].t:h.role}</span></div>
      ${h.note?`<div class="tl-note">${esc(h.note)}</div>`:''}</li>`).join('')||'<li>Belum ada aktivitas.</li>'}</ul>`;

  // footer actions by role/status
  const foot=document.getElementById('mdFoot');foot.innerHTML='';
  const add=(label,cls,fn)=>{const b=document.createElement('button');b.className='btn '+cls;b.textContent=label;b.onclick=fn;foot.appendChild(b);};
  const isOwner=(r.createdBy===u.name);
  const isRejected=(r.status==='rejected');

  // ---- Kasus khusus: notifikasi DITOLAK, dilihat oleh user pembuat (atau superuser) ----
  // Pilihan export diganti menjadi: Edit (perbaiki sesuai alasan tolak), Simpan Draft, Ajukan review CRS
  if(isRejected&&(isOwner||u.role==='user'||u.role==='superuser')){
    add('✏️ Edit (Perbaiki)','btn-primary',()=>ensurePhotos(r).then(()=>editRecord(r)));
    add('📤 Ajukan Ulang ke CRS','btn-accent',()=>transition(r,'review_crs','Diajukan ulang review ke CRS setelah perbaikan'));
    if(u.role==='superuser') add('🗑️ Hapus','btn-danger',()=>{if(confirm('Hapus notifikasi '+r.number+'?')){softDeleteIncident(r.id);closeModal('modalDetail');goPage('list');toast('Terhapus.','warn');}});
    openModal('modalDetail');return;
  }

  // ---- Export PDF/PPT: untuk record approved (semua), atau CRS/PJA/superuser kapan saja ----
  const canExport=(r.status==='approved')||['crs','pja','superuser'].includes(u.role);
  if(canExport){
    add('📄 Export PDF','btn',()=>ensurePhotos(r).then(()=>exportPDF(r)));
    add('📊 Export PPT','btn',()=>ensurePhotos(r).then(()=>exportPPT(r)));
  }

  // ---- Edit ----
  const canEdit=(r.status==='draft'&&(isOwner||u.role==='superuser'||u.role==='crs'))
            ||((u.role==='crs'||u.role==='superuser')&&r.status==='review_crs')
            ||((u.role==='pja'||u.role==='superuser')&&r.status==='review_pja');
  if(canEdit) add('✏️ Edit','btn',()=>ensurePhotos(r).then(()=>editRecord(r)));

  // ---- Workflow transitions ----
  if((u.role==='user'||u.role==='superuser')&&r.status==='draft'&&(isOwner||u.role==='superuser'))
    add('📤 Ajukan ke CRS','btn-accent',()=>transition(r,'review_crs','Diajukan review ke CRS'));

  if((u.role==='crs'||u.role==='superuser')&&r.status==='review_crs'){
    add('➡️ Teruskan ke PJA','btn-primary',()=>transition(r,'review_pja','Direview CRS, diteruskan ke PJA'));
    add('↩️ Reject','btn-danger',()=>rejectFlow(r));
  }
  if((u.role==='pja'||u.role==='superuser')&&r.status==='review_pja'){
    add('✅ Approve','btn-accent',()=>transition(r,'approved','Disetujui PJA — kembali ke CRS untuk blast email'));
    add('↩️ Reject','btn-danger',()=>rejectFlow(r));
  }
  // ---- Approved: CRS unduh PDF & blast email ----
  if((u.role==='crs'||u.role==='superuser')&&r.status==='approved')
    add('📧 Tandai Sudah Di-blast','btn-primary',()=>{pushHistory(r,'Notifikasi di-blast via email',u,'');save(LS_DATA,DATA);autoSync();toast('Ditandai sudah dikirim.','ok');openDetail(r.id);});

  // ---- Hapus ----
  if(u.role==='superuser'||((u.role==='user')&&r.status==='draft'&&isOwner))
    add('🗑️ Hapus','btn-danger',()=>{if(confirm('Hapus notifikasi '+r.number+'?')){softDeleteIncident(r.id);closeModal('modalDetail');goPage('list');toast('Terhapus.','warn');}});

  openModal('modalDetail');
}
function transition(r,to,note){
  const u=currentUser();r.status=to;pushHistory(r,STATUS[to].t,u,note);save(LS_DATA,DATA);autoSync();
  toast('Status → '+STATUS[to].t,'ok');openDetail(r.id);renderListRows&&renderListRows();
}
function rejectFlow(r){
  const note=prompt('Alasan reject (dikembalikan ke pelapor):');
  if(note===null)return;
  const u=currentUser();r.status='rejected';pushHistory(r,'DITOLAK',u,note||'Tanpa catatan');
  // kembalikan ke draft agar bisa diperbaiki
  r.status='rejected';r.updatedAt=new Date().toISOString();save(LS_DATA,DATA);autoSync();toast('Notifikasi ditolak & dikembalikan.','warn');openDetail(r.id);
}
</script>

<script>
/* =========================================================
   DASHBOARD
   ========================================================= */
function renderDashboard(){
  const el=document.getElementById('page-dashboard');
  const AD=activeData();const total=AD.length;
  const byStatus=k=>AD.filter(r=>r.status===k).length;
  const yr=new Date().getFullYear();
  const thisYear=AD.filter(r=>(r.date||'').startsWith(yr+'')).length;
  const hpri=AD.filter(r=>r.hpri==='Ya').length;
  const pending=byStatus('review_crs')+byStatus('review_pja');
  el.innerHTML=`
  <div class="grid g4" style="margin-bottom:20px">
    <div class="stat acc-blue"><div class="k">Total Notifikasi</div><div class="v">${total}</div><div class="d">${thisYear} pada tahun ${yr}</div></div>
    <div class="stat acc-orange"><div class="k">Menunggu Review</div><div class="v">${pending}</div><div class="d">CRS: ${byStatus('review_crs')} · PJA: ${byStatus('review_pja')}</div></div>
    <div class="stat acc-green"><div class="k">Approved</div><div class="v">${byStatus('approved')}</div><div class="d">Siap / sudah di-blast</div></div>
    <div class="stat acc-red"><div class="k">HPRI</div><div class="v">${hpri}</div><div class="d">High Potential Risk Incident</div></div>
  </div>
  <div class="grid g2">
    <div class="card"><div class="card-head"><h2>Insiden per Klasifikasi</h2></div><div class="card-body"><div class="chart-box"><canvas id="chClass"></canvas></div></div></div>
    <div class="card"><div class="card-head"><h2>Tren Insiden per Bulan (${yr})</h2></div><div class="card-body"><div class="chart-box"><canvas id="chTrend"></canvas></div></div></div>
  </div>
  <div class="card"><div class="card-head"><h2>Top 10 Insiden per Lokasi Umum (Area)</h2><span class="sub">Area dengan jumlah insiden terbanyak</span></div>
    <div class="card-body"><div class="chart-box" style="height:340px"><canvas id="chArea"></canvas></div></div></div>
  <div class="card"><div class="card-head"><h2>Notifikasi Terbaru</h2><span class="sub">5 entri terakhir</span></div>
    <div class="card-body tbl-wrap"><table class="data">
      <thead><tr><th>No</th><th>Judul</th><th>Tanggal</th><th>Klasifikasi</th><th>Status</th></tr></thead>
      <tbody>${AD.slice(0,5).map(r=>`<tr><td><b>${esc(r.number)}</b></td><td>${esc(r.title)}</td><td>${fmtDate(r.date)}</td><td>${classBadge(r.classification)}</td><td>${statusBadge(r.status)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Belum ada data.</td></tr>'}</tbody>
    </table></div></div>`;
  drawDashCharts();
}
let _c1,_c2,_c3;
function drawDashCharts(){
  if(_c1)_c1.destroy();if(_c2)_c2.destroy();if(_c3)_c3.destroy();
  const cctx=document.getElementById('chClass');
  const AD=activeData();const counts=CLASS_MASTER.map(c=>AD.filter(r=>r.classification===c).length);
  const palette=['#a93226','#e67e22','#f1c40f','#3498db','#95a5a6','#8e44ad','#16a085','#c0392b','#2980b9','#27ae60','#d35400','#7f8c8d'];
  _c1=new Chart(cctx,{type:'doughnut',data:{labels:CLASS_MASTER.slice(),datasets:[{data:counts,backgroundColor:CLASS_MASTER.map((c,i)=>palette[i%palette.length])}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:10}}}}}});
  const yr=new Date().getFullYear();
  const monthly=Array(12).fill(0);
  AD.forEach(r=>{if((r.date||'').startsWith(yr+'')){const m=parseInt(r.date.split('-')[1],10);if(m>=1&&m<=12)monthly[m-1]++;}});
  _c2=new Chart(document.getElementById('chTrend'),{type:'bar',data:{labels:['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'],datasets:[{label:'Jumlah Insiden',data:monthly,backgroundColor:'#12356e',borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}});
  // Top 10 per Lokasi Umum (Area)
  const areaCount={};
  AD.forEach(r=>{const loc=(r.location||'').trim();if(loc)areaCount[loc]=(areaCount[loc]||0)+1;});
  const top=Object.entries(areaCount).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const actx=document.getElementById('chArea');
  if(actx){
    _c3=new Chart(actx,{type:'bar',data:{labels:top.map(x=>x[0]),datasets:[{label:'Jumlah Insiden',data:top.map(x=>x[1]),backgroundColor:'#e67e22',borderRadius:4}]},
      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{title:items=>items[0].label}}},
        scales:{x:{beginAtZero:true,ticks:{precision:0}},y:{ticks:{font:{size:11},autoSkip:false}}}}});
  }
}
</script>

<script>
/* =========================================================
   REPORT & SUMMARY  (history + agregasi + export dataset)
   ========================================================= */
function renderReport(){
  const el=document.getElementById('page-report');
  el.innerHTML=`
  <div class="card">
    <div class="card-head"><h2>Report History Notifikasi & Summary</h2><span class="sub">Rekap, filter periode, dan export dataset Power BI</span></div>
    <div class="card-body">

        <div class="field"><label>Status</label><select id="rf_status" onchange="renderReport2()"><option value="">Semua</option>${Object.entries(STATUS).map(([k,v])=>`<option value="${k}">${v.t}</option>`).join('')}</select></div>

          <button class="btn" onclick="clearRepFilter()">Reset</button>

      </div>
      <div class="btn-row" style="margin-bottom:10px">
        <button class="btn btn-primary" onclick="exportDatasetXLSX()">📊 Export Dataset Power BI (Excel)</button>
        <button class="btn" onclick="exportDatasetCSV()">📁 Export Dataset (CSV)</button>
        <button class="btn" onclick="exportSummaryPDF()">📄 Export Summary (PDF)</button>
        <button class="btn" onclick="exportReportTemplate()">🧩 Template Report (kosong)</button>
      </div>
      <div class="btn-row" style="margin-bottom:16px;padding:10px 12px;background:#f4f6fa;border-radius:8px">
        <span style="font-weight:700;color:var(--navy);font-size:12.5px;align-self:center">Mass Upload History:</span>
        <button class="btn btn-sm" onclick="exportHistoryTemplate()">📄 Template History (Excel)</button>
        <button class="btn btn-sm btn-accent" onclick="triggerHistoryImport()">⬆️ Upload History (Excel)</button>
        <span class="hint" style="align-self:center">Unggah banyak notifikasi sekaligus tanpa input satu per satu.</span>
      </div>
      <div id="reportBody"></div>
    </div>
  </div>`;
  renderReport2();
}
function clearRepFilter(){['rf_from','rf_to'].forEach(i=>document.getElementById(i).value='');document.getElementById('rf_ccow').value='';document.getElementById('rf_status').value='';renderReport2();}
function reportFiltered(){
  const from=document.getElementById('rf_from').value;
  const to=document.getElementById('rf_to').value;
  const cw=document.getElementById('rf_ccow').value;
  const st=document.getElementById('rf_status').value;
  return activeData().filter(r=>{
    if(from&&(r.date||'')<from)return false;
    if(to&&(r.date||'')>to)return false;
    if(cw&&r.ccow!==cw)return false;
    if(st&&r.status!==st)return false;
    return true;
  });
}
function renderReport2(){
  const rows=reportFiltered();
  const box=document.getElementById('reportBody');
  // summary aggregates
  const total=rows.length;
  const byClass=CLASS_MASTER.map(c=>({label:c,n:rows.filter(r=>r.classification===c).length}));
  const byStat=Object.entries(STATUS).map(([k,v])=>({label:v.t,n:rows.filter(r=>r.status===k).length}));
  const byCcow=ccowCodes().map(c=>({label:c,n:rows.filter(r=>r.ccow===c).length})).filter(x=>x.n>0);
  const hpri=rows.filter(r=>r.hpri==='Ya').length;
  box.innerHTML=`
    <div class="grid g4" style="margin-bottom:18px">
      <div class="stat acc-blue"><div class="k">Total (terfilter)</div><div class="v">${total}</div></div>
      <div class="stat acc-red"><div class="k">Fatality + LTI</div><div class="v">${rows.filter(r=>r.classification==='Fatality'||r.classification==='LTI').length}</div></div>
      <div class="stat acc-orange"><div class="k">HPRI</div><div class="v">${hpri}</div></div>
      <div class="stat acc-green"><div class="k">Approved</div><div class="v">${rows.filter(r=>r.status==='approved').length}</div></div>
    </div>
    <div class="grid g2" style="margin-bottom:18px">
      <div class="card"><div class="card-head"><h2>Summary per Klasifikasi</h2></div><div class="card-body">
        <table class="data"><thead><tr><th>Klasifikasi</th><th>Jumlah</th><th>%</th></tr></thead><tbody>
        ${byClass.map(x=>`<tr><td>${classBadge(x.label)}</td><td>${x.n}</td><td>${total?((x.n/total*100).toFixed(1)):0}%</td></tr>`).join('')}
        <tr style="font-weight:800"><td>Total</td><td>${total}</td><td>100%</td></tr></tbody></table></div></div>
      <div class="card"><div class="card-head"><h2>Summary per Status</h2></div><div class="card-body">
        <table class="data"><thead><tr><th>Status</th><th>Jumlah</th></tr></thead><tbody>

function deleteHistory(id){
  if(currentUser().role!=='superuser'){toast('Hanya superuser yang dapat menghapus histori.','err');return;}
  const r=DATA.find(x=>x.id===id);if(!r)return;

  softDeleteIncident(id);renderReport();toast('Notifikasi dihapus dari histori.','warn');
}
function bulkDeleteHistory(){
  if(currentUser().role!=='superuser'){toast('Hanya superuser.','err');return;}
  const rows=reportFiltered();if(!rows.length){toast('Tidak ada data terfilter.','warn');return;}
  if(!confirm('Hapus '+rows.length+' notifikasi yang sedang terfilter dari histori?\nTindakan ini tidak dapat dibatalkan.'))return;

  DATA.forEach(x=>{if(ids.has(x.id)){x.deleted=true;x.updatedAt=new Date().toISOString();}});save(LS_DATA,DATA);autoSync();renderReport();toast(rows.length+' notifikasi dihapus.','warn');
}

/* dataset rows utk Power BI — Nilai Konsekuensi 0..5 per aspek */
function maxKons(o){let best='';ASPECT.forEach(a=>{const v=o[a.k];if(v!==''&&v!=null){const n=parseInt(v,10);if(best===''||n>parseInt(best,10))best=String(n);}});return best;}
function datasetRows(){
  return reportFiltered().map(r=>{
    const row={
      No_Notifikasi:r.number,CCOW:r.ccow,CCOW_Nama:ccowName(r.ccow)||'',
      Judul:r.title,Tanggal:r.date,Waktu:r.time,Lokasi:r.location,Lokasi_Detail:r.locationDetail||'',Perusahaan:r.company,
      Klasifikasi:r.classification,HPRI:r.hpri
    };
    ASPECT.forEach(a=>{row['Akt_'+a.s]=(r.sevAct[a.k]===''||r.sevAct[a.k]==null)?'':r.sevAct[a.k];});
    ASPECT.forEach(a=>{row['Pot_'+a.s]=(r.sevPot[a.k]===''||r.sevPot[a.k]==null)?'':r.sevPot[a.k];});
    row.Kons_Aktual_Tertinggi=maxKons(r.sevAct);
    row.Kons_Potensial_Tertinggi=maxKons(r.sevPot);
    Object.assign(row,{
      Kronologi:r.kronologi,
      Fakta:toList(r.fakta).join(' | '),
      Akibat_Manusia:r.akibatManusia||'',Akibat_Alat:r.akibatAlat||'',Akibat_Lingkungan:r.akibatLingkungan||'',
      Tindakan_Perbaikan:toList(r.corrective).join(' | '),
      Status:STATUS[r.status]?STATUS[r.status].t:r.status,
      Dilaporkan_Oleh:r.reportedBy,Disetujui_Oleh:r.approvedBy,
      Dibuat_Oleh:r.createdBy,Dibuat_Tanggal:r.createdAt
    });
    return row;
  });
}

<script>
/* =========================================================
   EXPORT PDF & PPT  (tampilan sesuai Form F-MAC-IMS-14-001)
   ========================================================= */
const NAVY='#0b2a5b';
function corrList(r){return toList(r.corrective);}
function faktaList(r){return toList(r.fakta);}
function sevLine(o){return ASPECT.map(a=>`${a.s}=${(o[a.k]===''||o[a.k]==null)?'-':o[a.k]}`).join('   ');}
function akibatLines(r){
  const arr=[['Manusia',r.akibatManusia],['Alat',r.akibatAlat],['Lingkungan',r.akibatLingkungan]].filter(x=>x[1]);
  return arr.map(x=>`${x[0]} : ${x[1]}`);
}
/* nama file export: yymmdd_NI_<CCOW>-<no>_<judul singkat> */
function exportFileName(r,ext){
  let ymd='000000';
  if(r.date){const p=r.date.split('-');if(p.length===3)ymd=p[0].slice(2)+p[1]+p[2];}
  const seq=(r.number||'').split('/')[0]||'';
  const cc=r.ccow||'';
  const shortTitle=(r.title||'insiden').replace(/[\\\/:*?"<>|]/g,'').replace(/\s+/g,' ').trim().slice(0,40);
  return `${ymd}_NI_${cc}${seq?('-'+seq):''} ${shortTitle}.${ext}`;
}

function exportPDF(r){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4',orientation:'landscape'});
  const W=297,H=210,M=10;
  const colL=M, colLW=138;
  const colR=M+colLW+6, colRW=W-colR-M;

  // ---- header: pita navy hanya di kiri (judul), sisi kanan putih agar logo berwarna menyatu ----
  function drawHeader(){

    doc.setFillColor(11,42,91);doc.rect(0,0,bandW,26,'F');
    doc.setTextColor(255);doc.setFont('helvetica','bold');doc.setFontSize(15);
    doc.text(r.title||'Judul Kecelakaan',M,11,{maxWidth:bandW-M-4});
    doc.setFontSize(9);doc.setFont('helvetica','normal');
    doc.text('No. Notifikasi Insiden : '+(r.number||''),M,19);
    // logo BERWARNA di area putih kanan
    try{const lw=44, lh=lw*187/520; doc.addImage(LOGO_FULL,'PNG',W-M-lw,3,lw,lh);}catch(e){}
    // subtitle
    doc.setTextColor(192,57,43);doc.setFont('helvetica','bold');doc.setFontSize(13);
    doc.text('Pemberitahuan Kecelakaan / Accident Notification',M,34);
    doc.setTextColor(30,39,51);
  }
  // footer pengesahan + kode dokumen
  function drawFooter(){
    doc.setTextColor(30,39,51);doc.setFont('helvetica','bold');doc.setFontSize(8.5);
    doc.text('Dilaporkan oleh : '+(r.reportedBy||'........'),M,H-10);

  }

  drawHeader();

  // ---- left info table ----
  let y=40;
  doc.setDrawColor(120);doc.setLineWidth(0.2);
  const cell=(x,yy,w,h,l1,l2)=>{doc.rect(x,yy,w,h);doc.setFontSize(8);doc.setFont('helvetica','normal');
    doc.text(l1,x+2,yy+4,{maxWidth:w-4});if(l2){doc.setTextColor(90);doc.text(l2,x+2,yy+8,{maxWidth:w-4});doc.setTextColor(30,39,51);}};
  const half=colLW/2;
  const locFull=(r.location||'')+(r.locationDetail?' — '+r.locationDetail:'');
  cell(colL,y,half,11,'Tanggal / Date : '+fmtDate(r.date));cell(colL+half,y,half,11,'Lokasi / Location : '+locFull);
  cell(colL,y+11,half,11,'Waktu / Time : '+(r.time||''));cell(colL+half,y+11,half,11,'Perusahaan / Company : '+(r.company||''));
  cell(colL,y+22,half,13,'Klasifikasi insiden :',(r.classification||''));cell(colL+half,y+22,half,13,'Apakah termasuk HPRI :',(r.hpri||'-'));
  cell(colL,y+35,colLW,15,'Tingkat keparahan / Severity :','');
  doc.setFontSize(7.5);doc.text('Aktual   : '+sevLine(r.sevAct),colL+2,y+45);doc.text('Potensial: '+sevLine(r.sevPot),colL+2,y+49);

  // ---- kolom kanan: tindakan perbaikan + foto (hanya di halaman pertama) ----
  doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(30,39,51);
  doc.text('Tindakan perbaikan yang dilakukan:',colR,40);
  doc.setFont('helvetica','normal');doc.setFontSize(8.5);let ry=46;
  corrList(r).forEach((c,i)=>{const ln=doc.splitTextToSize(`${i+1}. ${c}`,colRW);doc.text(ln,colR,ry);ry+=ln.length*4+1;});
  const pboxY=Math.max(ry+2,86),pboxH=H-pboxY-22;
  doc.setDrawColor(120);doc.rect(colR,pboxY,colRW,pboxH);
  doc.setTextColor(11,42,91);doc.setFont('helvetica','bold');doc.setFontSize(11);doc.text('Foto',colR+3,pboxY+7);
  if(r.photos&&r.photos.length){try{doc.addImage(r.photos[0].data,'JPEG',colR+3,pboxY+10,colRW-6,pboxH-13);}catch(e){}}

  // ---- penjelasan (kolom kiri) dengan auto page-break ----
  const BOTTOM=H-18;      // batas bawah aman (di atas footer)
  let py=y+56;
  doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(30,39,51);
  doc.text('Penjelasan Insiden :',colL,py);py+=5;

  // pindah halaman bila sisa ruang tak cukup untuk blok berikut (needH mm)
  function ensureSpace(needH){
    if(py+needH>BOTTOM){
      drawFooter();
      doc.addPage();
      drawHeader();
      py=42;
      doc.setTextColor(30,39,51);
    }
  }
  function block(title,txt){
    if(!txt)return;
    doc.setFont('helvetica','normal');doc.setFontSize(8);

    doc.setFont('helvetica','bold');doc.text(title,colL,py);py+=4;

    doc.setFont('helvetica','normal');

  }

  block('Kronologi awal:',r.kronologi);
  blockList('Fakta kejadian:',faktaList(r));
  const akb=[['Manusia',r.akibatManusia],['Alat',r.akibatAlat],['Lingkungan',r.akibatLingkungan]].filter(x=>x[1]);

}

  y+=3;doc.setFont('helvetica','bold');doc.text('Rekap per Status',M,y);y+=5;doc.setFont('helvetica','normal');
  Object.entries(STATUS).forEach(([k,v])=>{const n=rows.filter(r=>r.status===k).length;doc.text(`${v.t}: ${n}`,M+2,y);y+=5;});
  y+=4;doc.setFont('helvetica','bold');doc.setFontSize(10);doc.text('Daftar Notifikasi',M,y);y+=6;
  doc.setFontSize(7.5);
  doc.setFont('helvetica','bold');doc.text('No',M,y);doc.text('Judul',M+42,y);doc.text('Tgl',M+120,y);doc.text('Klas',M+142,y);doc.text('Status',M+160,y);y+=4;
  doc.setFont('helvetica','normal');
  rows.forEach(r=>{
    if(y>280){doc.addPage();y=20;}
    doc.text(String(r.number||'').slice(0,26),M,y);
    doc.text(String(r.title||'').slice(0,45),M+42,y);
    doc.text(fmtDate(r.date),M+120,y);
    doc.text(r.classification||'',M+142,y);
    doc.text((STATUS[r.status]||{t:r.status}).t,M+160,y);y+=4.5;
  });
  doc.save('Summary_Notifikasi_Insiden.pdf');
  toast('Summary PDF diexport.','ok');
}
</script>

function openUserEditor(id){

    <div class="field" style="margin-top:12px"><label>Departemen</label><input id="mu_dept" value="${esc(u.dept||'')}"></div>
    <div class="field" style="margin-top:12px"><label>Role <span class="req">*</span></label><select id="mu_role">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${u.role===k?'selected':''}>${v.t}</option>`).join('')}</select></div>
    <div class="field" style="margin-top:12px"><label>Password ${id?'(kosongkan bila tidak diubah)':'<span class="req">*</span>'}</label><input id="mu_pass" type="text" placeholder="${id?'••••••':'password awal'}"></div>
    <div class="field" style="margin-top:12px"><label>Status</label><select id="mu_active"><option value="1" ${u.active?'selected':''}>Aktif</option><option value="0" ${!u.active?'selected':''}>Non-aktif</option></select></div>`;
  openModal('modalUser');
}
function saveUser(){
  const g=id=>document.getElementById(id).value.trim();
  const name=g('mu_name'),email=g('mu_email'),dept=g('mu_dept'),role=g('mu_role'),pass=g('mu_pass'),active=g('mu_active')==='1';
  if(!name||!email){toast('Nama & email wajib diisi.','err');return;}
  if(USERS.some(x=>x.email.toLowerCase()===email.toLowerCase()&&x.id!==editingUserId)){toast('Email sudah dipakai user lain.','err');return;}
  if(editingUserId){
    const u=USERS.find(x=>x.id===editingUserId);
    Object.assign(u,{name,email,dept,role,active});if(pass)u.pass=pass;
  }else{
    if(!pass){toast('Password awal wajib diisi.','err');return;}
    USERS.push({id:uid(),name,email,dept,role,pass,active});
  }
  save(LS_USERS,USERS);closeModal('modalUser');renderSetting();toast('User tersimpan.','ok');
}
function resetPass(id){
  const np=prompt('Password baru untuk user ini:');if(!np)return;
  const u=USERS.find(x=>x.id===id);u.pass=np;save(LS_USERS,USERS);toast('Password direset.','ok');
}
function delUser(id){
  if(!confirm('Hapus user ini?'))return;
  USERS=USERS.filter(x=>x.id!==id);save(LS_USERS,USERS);renderSetting();toast('User dihapus.','warn');
}
/* ---- Master CCOW ---- */
function openCcowEditor(id){
  const c=id?CCOW_MASTER.find(x=>x.id===id):{id:null,code:'',name:'',ktt:'',doc:''};
  document.getElementById('mstTitle').textContent=id?'Edit CCOW':'Tambah CCOW';
  document.getElementById('mstBody').innerHTML=`
    <div class="field"><label>Kode CCOW <span class="req">*</span></label><input id="mst_code" value="${esc(c.code)}" maxlength="6" style="text-transform:uppercase" placeholder="MC"></div>

    <div class="field" style="margin-top:12px"><label>KTT (Disetujui oleh)</label><input id="mst_ktt" value="${esc(c.ktt||'')}" placeholder="Rahmad Taufik Siregar (KTT PT Maruwai Coal)"><div class="hint">Terisi otomatis di kolom "Disetujui oleh" saat CCOW dipilih.</div></div>
    <div class="field" style="margin-top:12px"><label>Kode Dokumen</label><input id="mst_doc" value="${esc(c.doc||'')}" placeholder="F-MAC-IMS-14-001 Rev 4.0"><div class="hint">Muncul di output PDF/PPT, sinkron dengan KTT sesuai CCOW.</div></div>`;
  document.getElementById('mstSave').onclick=()=>saveCcow(id);
  openModal('modalMaster');
}
function saveCcow(id){
  const code=document.getElementById('mst_code').value.trim().toUpperCase();
  const name=document.getElementById('mst_name').value.trim();
  const ktt=document.getElementById('mst_ktt').value.trim();
  const doc=document.getElementById('mst_doc').value.trim();
  if(!code||!name){toast('Kode & nama wajib diisi.','err');return;}
  if(CCOW_MASTER.some(x=>x.code===code&&x.id!==id)){toast('Kode CCOW sudah ada.','err');return;}
  if(id){const c=CCOW_MASTER.find(x=>x.id===id);const old=c.code;c.code=code;c.name=name;c.ktt=ktt;c.doc=doc;
    if(old!==code)COMPANY_MASTER.forEach(co=>{if(co.ccow===old)co.ccow=code;});save(LS_COMPANY,COMPANY_MASTER);
  }else{CCOW_MASTER.push({id:uid(),code,name,ktt,doc});}
  save(LS_CCOW,CCOW_MASTER);closeModal('modalMaster');renderSetting();autoSync();toast('Master CCOW tersimpan.','ok');
}
function delCcow(id){
  const c=CCOW_MASTER.find(x=>x.id===id);
  if(COMPANY_MASTER.some(co=>co.ccow===c.code)){alert('CCOW '+c.code+' masih dipakai oleh data perusahaan. Ubah/hapus perusahaan terkait dahulu.');return;}
  if(!confirm('Hapus CCOW '+c.code+'?'))return;
  CCOW_MASTER=CCOW_MASTER.filter(x=>x.id!==id);save(LS_CCOW,CCOW_MASTER);renderSetting();toast('CCOW dihapus.','warn');
}
/* ---- Master Perusahaan (1 perusahaan bisa multi CCOW) ---- */
function openCompanyEditor(id){
  const c=id?COMPANY_MASTER.find(x=>x.id===id):{id:null,name:'',ccow:''};
  document.getElementById('mstTitle').textContent=id?'Edit Perusahaan':'Tambah Perusahaan';
  // saat edit: hanya 1 CCOW aktif (baris itu). saat tambah: bisa pilih banyak CCOW sekaligus.
  const checks=CCOW_MASTER.map(x=>`<label style="display:flex;gap:8px;align-items:center;padding:4px 0">
      <input type="checkbox" class="mst_ccow_chk" value="${x.code}" ${(id?c.ccow===x.code:false)?'checked':''}>
      <span><b>${x.code}</b> — ${esc(x.name)}</span></label>`).join('');
  document.getElementById('mstBody').innerHTML=`
    <div class="field"><label>Nama Perusahaan <span class="req">*</span></label><input id="mst_cname" value="${esc(c.name)}" placeholder="PT. Putra Perkasa Abadi (PPA)"></div>
    <div class="field" style="margin-top:12px"><label>CCOW <span class="req">*</span> ${id?'':'<span style="font-weight:400;color:var(--muted)">(boleh pilih lebih dari satu)</span>'}</label>
      <div style="border:1px solid var(--line);border-radius:8px;padding:8px 12px;max-height:200px;overflow:auto">${checks}</div>
      <div class="hint">${id?'Untuk menambah CCOW lain pada perusahaan yang sama, gunakan tombol "+ Tambah Perusahaan" dan pilih CCOW-nya.':'Satu perusahaan yang beroperasi di beberapa CCOW akan dibuat menjadi beberapa baris otomatis (mis. PPA-MC dan PPA-LC).'}</div></div>`;
  document.getElementById('mstSave').onclick=()=>saveCompany(id);
  openModal('modalMaster');
}
function saveCompany(id){
  const name=document.getElementById('mst_cname').value.trim();
  const picked=[...document.querySelectorAll('.mst_ccow_chk:checked')].map(x=>x.value);
  if(!name){toast('Nama perusahaan wajib.','err');return;}
  if(!picked.length){toast('Pilih minimal satu CCOW.','err');return;}
  const exists=(nm,cw,selfId)=>COMPANY_MASTER.some(x=>x.name.toLowerCase()===nm.toLowerCase()&&x.ccow===cw&&x.id!==selfId);
  if(id){
    const cw=picked[0];
    if(exists(name,cw,id)){toast('Kombinasi perusahaan + CCOW sudah ada.','err');return;}
    const c=COMPANY_MASTER.find(x=>x.id===id);c.name=name;c.ccow=cw;
  }else{
    let added=0,skip=0;
    picked.forEach(cw=>{if(exists(name,cw,null)){skip++;}else{COMPANY_MASTER.push({id:uid(),name,ccow:cw});added++;}});
    if(added===0){toast('Semua kombinasi sudah ada.','warn');return;}
    if(skip)toast(added+' ditambahkan, '+skip+' dilewati (sudah ada).','ok');
  }
  save(LS_COMPANY,COMPANY_MASTER);closeModal('modalMaster');renderSetting();autoSync();toast('Master perusahaan tersimpan.','ok');
}
function delCompany(id){
  const c=COMPANY_MASTER.find(x=>x.id===id);
  if(!confirm('Hapus perusahaan "'+c.name+' ('+c.ccow+')"?'))return;
  COMPANY_MASTER=COMPANY_MASTER.filter(x=>x.id!==id);save(LS_COMPANY,COMPANY_MASTER);renderSetting();toast('Perusahaan dihapus.','warn');
}
/* ---- Master list sederhana: Klasifikasi & Lokasi ---- */
function simpleCfg(kind){return kind==='class'
  ?{arr:()=>CLASS_MASTER,set:v=>{CLASS_MASTER=v;save(LS_CLASS,CLASS_MASTER);},label:'Tipe Insiden'}
  :{arr:()=>LOC_MASTER,set:v=>{LOC_MASTER=v;save(LS_LOC,LOC_MASTER);},label:'Lokasi Umum'};}
function openSimpleEditor(kind,idx){
  const cfg=simpleCfg(kind);const cur=(idx==null)?'':cfg.arr()[idx];
  document.getElementById('mstTitle').textContent=(idx==null?'Tambah ':'Edit ')+cfg.label;
  document.getElementById('mstBody').innerHTML=`<div class="field"><label>${cfg.label} <span class="req">*</span></label><input id="mst_simple" value="${esc(cur)}"></div>`;
  document.getElementById('mstSave').onclick=()=>saveSimple(kind,idx);
  openModal('modalMaster');
}
function saveSimple(kind,idx){
  const cfg=simpleCfg(kind);const val=document.getElementById('mst_simple').value.trim();
  if(!val){toast('Tidak boleh kosong.','err');return;}
  let arr=cfg.arr().slice();
  if(arr.some((x,i)=>x.toLowerCase()===val.toLowerCase()&&i!==idx)){toast('Data sudah ada.','err');return;}
  if(idx==null)arr.push(val);else arr[idx]=val;
  cfg.set(arr);closeModal('modalMaster');renderSetting();toast(cfg.label+' tersimpan.','ok');
}
function delSimple(kind,idx){
  const cfg=simpleCfg(kind);const arr=cfg.arr().slice();const val=arr[idx];
  if(!confirm('Hapus "'+val+'"?'))return;
  arr.splice(idx,1);cfg.set(arr);renderSetting();toast('Data dihapus.','warn');
}

  </div>`;

function sheetFrom(headers,rows){
  const aoa=[headers].concat(rows.map(r=>headers.map(h=>r[h]!==undefined?r[h]:'')));
  return XLSX.utils.aoa_to_sheet(aoa);
}
function readFirstSheet(file,cb){
  const r=new FileReader();
  r.onload=()=>{try{
    const wb=XLSX.read(new Uint8Array(r.result),{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const json=XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});
    cb(json);
  }catch(e){toast('File Excel tidak terbaca: '+e.message,'err');alert('Gagal membaca file Excel:\n'+e.message);}};
  r.readAsArrayBuffer(file);
}

/* ---- Import master dari Excel ---- */
function importMaster(kind,file){
  const d=XLS_DEFS[kind];
  readFirstSheet(file,rows=>{
    if(!rows.length){toast('File kosong / tidak ada baris data.','warn');return;}
    let added=0,updated=0,skipped=0;const errs=[];
    const validCcow=new Set(CCOW_MASTER.map(c=>c.code));
    rows.forEach((row,i)=>{
      const ln=i+2;
      if(kind==='ccow'){
        const code=String(row['Kode CCOW']||'').trim().toUpperCase();
        const name=String(row['Nama']||'').trim();
        if(!code||!name){errs.push('Baris '+ln+': Kode/Nama kosong');skipped++;return;}
        const ktt=String(row['KTT (Disetujui oleh)']||'').trim();
        const docv=String(row['Kode Dokumen']||'').trim()||('F-'+code+'-IMS-14-001 Rev 4.0');
        const ex=CCOW_MASTER.find(x=>x.code===code);
        if(ex){ex.name=name;ex.ktt=ktt;ex.doc=docv;updated++;}
        else{CCOW_MASTER.push({id:uid(),code,name,ktt,doc:docv});added++;}
      }else if(kind==='company'){
        const name=String(row['Nama Perusahaan']||'').trim();
        const cw=String(row['CCOW']||'').trim().toUpperCase();
        if(!name||!cw){errs.push('Baris '+ln+': Nama/CCOW kosong');skipped++;return;}
        if(!validCcow.has(cw)){errs.push('Baris '+ln+': CCOW "'+cw+'" tidak dikenal');skipped++;return;}
        if(COMPANY_MASTER.some(x=>x.name.toLowerCase()===name.toLowerCase()&&x.ccow===cw)){skipped++;return;}
        COMPANY_MASTER.push({id:uid(),name,ccow:cw});added++;
      }else{ // class / loc (list sederhana)
        const key=kind==='class'?'Tipe Insiden':'Lokasi Umum';
        const val=String(row[key]||'').trim();
        if(!val){skipped++;return;}
        const arr=kind==='class'?CLASS_MASTER:LOC_MASTER;
        if(arr.some(x=>x.toLowerCase()===val.toLowerCase())){skipped++;return;}
        arr.push(val);added++;
      }
    });
    // simpan
    if(kind==='ccow')save(LS_CCOW,CCOW_MASTER);
    else if(kind==='company')save(LS_COMPANY,COMPANY_MASTER);
    else if(kind==='class')save(LS_CLASS,CLASS_MASTER);
    else if(kind==='loc')save(LS_LOC,LOC_MASTER);
    renderSetting();
    let msg='Import '+d.sheet+': '+added+' ditambah'+(updated?', '+updated+' diperbarui':'')+(skipped?', '+skipped+' dilewati':'')+'.';
    toast(msg,'ok');
    if(errs.length)alert(msg+'\n\nCatatan:\n• '+errs.slice(0,15).join('\n• ')+(errs.length>15?'\n… dan '+(errs.length-15)+' lainnya':''));
  });
}

  inp.onchange=e=>{if(e.target.files[0])importMaster(kind,e.target.files[0]);};

}

/* =========================================================
   SINKRONISASI GOOGLE SHEET (hybrid: offline + sync online)
   ========================================================= */
const LS_SYNC='ni_sync_cfg';
function syncCfg(){return load(LS_SYNC,{url:'',secret:'',auto:true,lastSync:''});}
function saveSyncCfg(c){save(LS_SYNC,c);}
function syncConfigured(){const c=syncCfg();return !!(c.url&&c.secret);}

/* payload seluruh data lokal untuk dikirim ke server */
function syncPayload(){
  // foto (base64) TIDAK dikirim ke Sheet. Sebagai gantinya foto diunggah ke
  // Drive (lewat uploadPhoto) dan hanya photoIds (pendek) yang disimpan.
  const incidentsNoPhoto=DATA.map(r=>{
    const c=Object.assign({},r);
    // kumpulkan driveId dari foto yang sudah terunggah
    if(c.photos&&c.photos.length){
      const ids=c.photos.map(p=>p.driveId).filter(Boolean);
      if(ids.length)c.photoIds=ids;
      c.hasPhoto=true;
    }
    delete c.photos;
    return c;
  });
  return {
    incidents:incidentsNoPhoto,
    users:USERS,
    ccow:CCOW_MASTER,
    company:COMPANY_MASTER,
    classm:CLASS_MASTER,
    locm:LOC_MASTER
  };
}
/* unggah semua foto yang belum punya driveId ke Drive; simpan driveId-nya */
async function uploadPendingPhotos(){
  if(!syncConfigured())return;
  const pending=[];
  DATA.forEach(r=>{(r.photos||[]).forEach(p=>{if(p.data&&!p.driveId)pending.push(p);});});
  if(!pending.length)return;
  // unggah bertahap (maks 3 foto per panggilan agar tidak terlalu besar)
  for(let i=0;i<pending.length;i+=3){
    const batch=pending.slice(i,i+3);
    const j=await syncCall('uploadPhoto',{photos:batch.map(p=>({name:p.id+'.jpg',data:p.data}))});
    if(j.ids)batch.forEach((p,k)=>{if(j.ids[k])p.driveId=j.ids[k];});
  }
  // catat photoIds di tiap record & simpan
  DATA.forEach(r=>{if(r.photos&&r.photos.length){const ids=r.photos.map(p=>p.driveId).filter(Boolean);if(ids.length)r.photoIds=ids;}});
  save(LS_DATA,DATA);
}
/* terapkan data hasil merge dari server ke lokal — pertahankan foto lokal */
function applyServerData(d){
  if(!d)return;
  if(Array.isArray(d.incidents)){
    // simpan foto lokal per-id sebelum menimpa
    const localPhotos={};
    DATA.forEach(r=>{if(r.photos&&r.photos.length)localPhotos[r.id]=r.photos;});
    DATA=d.incidents.map(r=>{
      const c=Object.assign({},r);
      if(!c.photos&&localPhotos[c.id])c.photos=localPhotos[c.id]; // pasang kembali foto lokal
      return c;
    });
    save(LS_DATA,DATA);
  }
  if(Array.isArray(d.users)&&d.users.length){USERS=d.users;save(LS_USERS,USERS);}
  if(Array.isArray(d.ccow)&&d.ccow.length){CCOW_MASTER=d.ccow;save(LS_CCOW,CCOW_MASTER);}
  if(Array.isArray(d.company)){COMPANY_MASTER=d.company;save(LS_COMPANY,COMPANY_MASTER);}
  if(Array.isArray(d.classm)&&d.classm.length){CLASS_MASTER=d.classm;save(LS_CLASS,CLASS_MASTER);}
  if(Array.isArray(d.locm)&&d.locm.length){LOC_MASTER=d.locm;save(LS_LOC,LOC_MASTER);}
}
/* ambil foto dari Drive untuk record yg punya photoIds tapi belum ada data lokal */
async function ensurePhotos(rec){
  if(!rec||!syncConfigured())return rec;
  const have=new Set((rec.photos||[]).map(p=>p.driveId).filter(Boolean));
  const need=(rec.photoIds||[]).filter(id=>!have.has(id));
  if(!need.length)return rec;
  if(!navigator.onLine){toast('Foto tersimpan online — sambungkan internet untuk memuatnya.','warn');return rec;}
  try{
    const j=await syncCall('getPhoto',{ids:need});
    rec.photos=rec.photos||[];
    need.forEach(id=>{const data=j.photos&&j.photos[id];if(data)rec.photos.push({id:uid(),data,driveId:id});});
    save(LS_DATA,DATA);
  }catch(e){/* diamkan; tampilkan tanpa foto */}
  return rec;
}

let _syncing=false, _syncPendingWhileOffline=false;
function setSyncBadge(state,msg){
  const el=document.getElementById('syncBadge');
  if(!el)return;
  const map={idle:['#eef1f6','#69748a','☁︎ Sinkron'],ok:['#e8f8f0','#1e8449','✓ Tersinkron'],busy:['#fef5e7','#b9770e','⟳ Menyinkron…'],err:['#fdecea','#a93226','⚠︎ Gagal sinkron'],off:['#eef1f6','#69748a','⌁ Offline']};
  const m=map[state]||map.idle;
  el.style.background=m[0];el.style.color=m[1];el.textContent=msg||m[2];
}

/* panggilan inti ke Apps Script */
async function syncCall(action,extra){
  const c=syncCfg();
  if(!c.url||!c.secret)throw new Error('Belum dikonfigurasi');
  const res=await fetch(c.url,{
    method:'POST',
    // text/plain menghindari CORS preflight ke Apps Script
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(Object.assign({secret:c.secret,action:action},extra||{}))
  });
  const txt=await res.text();
  let json;try{json=JSON.parse(txt);}catch(e){throw new Error('Respons tidak valid dari server');}
  if(!json.ok)throw new Error(json.error||'Gagal');
  return json;
}

/* sinkron penuh: kirim data lokal -> server merge -> terapkan balik */
async function doSync(silent){
  if(!syncConfigured()){if(!silent)toast('Atur URL & kunci di Setting → Integrasi Google Sheet.','warn');return false;}
  if(_syncing)return false;
  if(!navigator.onLine){setSyncBadge('off');_syncPendingWhileOffline=true;if(!silent)toast('Sedang offline — akan disinkron saat online kembali.','warn');return false;}
  _syncing=true;setSyncBadge('busy');
  try{
    await uploadPendingPhotos();            // unggah foto ke Drive dulu (bila ada)
    const json=await syncCall('sync',{data:syncPayload()});
    applyServerData(json.data);
    const c=syncCfg();c.lastSync=new Date().toISOString();saveSyncCfg(c);
    setSyncBadge('ok');
    _syncPendingWhileOffline=false;
    // refresh tampilan halaman aktif
    const active=document.querySelector('.nav button.active');
    if(active)goPage(active.dataset.page);
    if(!silent)toast('Data tersinkron dengan Google Sheet.','ok');
    return true;
  }catch(e){
    setSyncBadge('err');
    if(!silent)toast('Gagal sinkron: '+e.message,'err');
    return false;
  }finally{_syncing=false;}
}

/* auto-sync: dipanggil setiap ada perubahan; di-debounce agar tidak spam */
let _autoTimer=null;
function autoSync(){
  const c=syncCfg();
  if(!c.url||!c.secret||!c.auto)return;
  clearTimeout(_autoTimer);
  _autoTimer=setTimeout(()=>{doSync(true);},1200);
}

/* saat kembali online, sinkron otomatis bila ada perubahan tertunda */
window.addEventListener('online',()=>{if(syncConfigured()){setSyncBadge('idle');if(_syncPendingWhileOffline||syncCfg().auto)doSync(true);}});
window.addEventListener('offline',()=>{if(syncConfigured())setSyncBadge('off');});

function restoreAll(e){
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
    if(d.users){USERS=d.users;save(LS_USERS,USERS);}
    if(d.incidents){DATA=d.incidents;save(LS_DATA,DATA);}
    if(d.ccow){CCOW_MASTER=d.ccow;save(LS_CCOW,CCOW_MASTER);}
    if(d.company){COMPANY_MASTER=d.company;save(LS_COMPANY,COMPANY_MASTER);}
    if(d.classm){CLASS_MASTER=d.classm;save(LS_CLASS,CLASS_MASTER);}
    if(d.locm){LOC_MASTER=d.locm;save(LS_LOC,LOC_MASTER);}
    if(d.seq)save(LS_SEQ,d.seq);
    renderSetting();toast('Restore berhasil.','ok');
  }catch(err){toast('File tidak valid.','err');}};
  r.readAsText(f);e.target.value='';
}
function wipeData(){
  if(!confirm('Hapus SEMUA notifikasi? Tindakan ini tidak bisa dibatalkan.'))return;
  DATA=[];save(LS_DATA,DATA);renderSetting();toast('Semua notifikasi dihapus.','warn');
}
</script>
</body>
